<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>الجدول الزمني</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap">
  <style>
    :root{--bg:#edf1f5;--surface:#fff;--alt:#f5f8fb;--ink:#10222f;--muted:#5a6b78;--line:#d6dee6;--head:#10222f;--accent:#0e7c86;--warning:#c93232;font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;color:var(--ink)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);padding:2rem 16px 3rem}.page{max-width:78rem;margin:auto}.top{text-align:center;margin-bottom:1.5rem}h1{margin:0;font:700 clamp(2.2rem,6vw,3.6rem)/1.2 'Reem Kufi',Tahoma,sans-serif}h1:after{content:'';display:block;width:4.5rem;height:5px;border-radius:4px;background:var(--accent);margin:.6rem auto}.meta{display:grid;grid-template-columns:1fr auto 1fr;gap:.6em;max-width:42rem;margin:auto;color:var(--muted);font-size:.9rem}.s1{text-align:left}.s3{text-align:right}.s2{border-inline:1px solid var(--line);padding-inline:.6em}.group{color:var(--muted);margin-top:.5rem}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 12px 32px -18px #10222f55}.scroll{overflow-x:auto}table{width:100%;min-width:66rem;border-collapse:separate;border-spacing:0;table-layout:fixed}th{background:var(--head);color:#eaf2f7;padding:.95rem .4rem;font-size:.92rem}td{padding:.55rem .4rem;text-align:center;border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);background:var(--surface)}tr:nth-child(even) td{background:var(--alt)}th:first-child,td:first-child{position:sticky;right:0;z-index:1}td:first-child{box-shadow:-1px 0 var(--line);text-align:right}th:first-child{z-index:2}.modwrap{display:flex;align-items:center;gap:.4rem}.dot{width:.35rem;height:1.9rem;border-radius:3px;background:hsl(var(--h) 65% 42%);flex:none}.cell{min-height:2rem;padding:.3rem .4rem;border-radius:8px;overflow-wrap:anywhere;outline:0}.time{white-space:nowrap;background:hsl(var(--h) 62% 90%);color:hsl(var(--h) 45% 22%);font-weight:500;font-size:.82rem}.cell:empty:before{content:'—';color:var(--muted);opacity:.6}.note{display:flex;gap:.75rem;align-items:baseline;padding:.85rem 1.1rem;background:var(--alt)}.note strong{color:var(--accent)}.note .cell{flex:1}.editable .cell{cursor:text}.editable .cell:focus{box-shadow:0 0 0 2px var(--accent);background:#fff}.locked .cell{cursor:default}.status{min-height:1.5rem;text-align:center;color:var(--muted);margin:1rem}.admin-bar{display:none;justify-content:center;gap:.6rem;margin-top:1.25rem}.admin-bar.active{display:flex}.btn{border:0;border-radius:8px;padding:.7rem 1.1rem;font:600 1rem inherit;cursor:pointer}.save{background:var(--accent);color:#fff}.logout{background:#e7edf1;color:var(--ink)}.admin-trigger{position:fixed;left:18px;bottom:18px;width:42px;height:42px;border-radius:50%;border:0;background:var(--warning);color:#fff;font-size:1.2rem;cursor:pointer;box-shadow:0 4px 12px #0004}.dialog{border:0;border-radius:14px;padding:0;max-width:min(92vw,370px);box-shadow:0 18px 55px #0005}.dialog::backdrop{background:#0008}.dialog form{padding:1.4rem}.dialog h2{margin:0 0:.5rem;font-family:'Reem Kufi',sans-serif}.dialog input{width:100%;padding:.7rem;border:1px solid var(--line);border-radius:8px;font:inherit;direction:ltr}.dialog menu{display:flex;justify-content:flex-start;gap:.5rem;margin:1rem 0 0;padding:0}.error{color:#b42318;min-height:1.5rem;margin:.6rem 0 0;font-size:.9rem}@media(max-width:600px){body{padding-top:1.25rem}.meta{font-size:.7rem}}
  </style>
</head>
<body>
  <div class="page locked" id="page">
    <header class="top"><h1>الجدول الزمني</h1><div class="meta"><span class="s1"><span class="cell" data-k="subj">القانون الإداري والمالي</span></span><span class="s2"><span class="cell" data-k="sem">السداسي الخامس</span></span><span class="s3"><span class="cell" data-k="year">2026/2027</span></span></div><div class="group"><span class="cell" data-k="group">مجموعة A</span></div></header>
    <main class="card"><div class="scroll"><table><thead><tr><th>عنوان الوحدة</th><th>الأستاذ</th><th>الإثنين</th><th>الثلاثاء</th><th>الأربعاء</th><th>الخميس</th><th>الجمعة</th><th>السبت</th><th>القاعة</th></tr></thead><tbody id="rows"></tbody></table></div><div class="note"><strong>ملاحظة:</strong><div class="cell" data-k="note"></div></div></main>
    <p class="status" id="status">جار تحميل الجدول…</p><div class="admin-bar" id="adminBar"><button class="btn save" id="save">تأكيد ونشر التعديلات</button><button class="btn logout" id="logout">خروج</button></div>
  </div>
  <button class="admin-trigger" id="adminTrigger" aria-label="دخول المشرف" title="دخول المشرف">●</button>
  <dialog class="dialog" id="loginDialog"><form id="loginForm"><h2>دخول المشرف</h2><label for="code">رمز الدخول</label><input id="code" type="password" autocomplete="current-password" required><p class="error" id="loginError"></p><menu><button class="btn save" type="submit">دخول</button><button class="btn logout" type="button" id="closeDialog">إلغاء</button></menu></form></dialog>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (() => {
    const client = window.supabase.createClient('https://avjzcbwpdpxarbvkfemo.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF2anpjYndwZHB4YXJidmtmZW1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU2MzkwMDksImV4cCI6MjExMTIxNTAwOX0.NPtKBIiW5yDwSpHZRRc-LqFl8HJPnxvtAosyyLTaoQA');
    const rows = [{h:190,m:'الطلبيات.ع.',p:'د.سعيد رشيد',d:['08:30 – 10:30','','08:30 – 10:30','','',''],r:'قاعة 12'},{h:150,m:'النظرية.ع.ض',p:'د.زوبير هشام',d:['','10:45 – 12:45','','08:30 – 10:30','',''],r:'قاعة 5'},{h:35,m:'طرق.ت.م.ع',p:'د.أعميمي رضوان',d:['10:45 – 12:45','','','','08:30 – 10:30',''],r:'قاعة 7'},{h:345,m:'التدبير.ع.ج',p:'د.محضوض أمين',d:['','08:30 – 10:30','','10:45 – 12:45','',''],r:'قاعة 3'},{h:220,m:'تدبير.م.ح',p:'د.الوسطاتي عبد الرحمان',d:['','','14:30 – 16:30','','','08:30 – 10:30'],r:'المدرج أ'},{h:95,m:'مناهج.ب.ت',p:'د.ميلود بلقاضي',d:['14:30 – 16:30','','','','10:45 – 12:45',''],r:'قاعة 9'},{h:260,m:'اللغة الإنجليزية',p:'دة.عدوي عائشة',d:['','14:30 – 16:30','','','','10:45 – 12:45'],r:'قاعة 2'}];
    const page=document.querySelector('#page'), status=document.querySelector('#status'), bar=document.querySelector('#adminBar'), dialog=document.querySelector('#loginDialog');
    function cell(k,v,cls=''){return `<div class="cell ${cls}" data-k="${k}">${v}</div>`} function build(){document.querySelector('#rows').innerHTML=rows.map((r,i)=>`<tr style="--h:${r.h}"><td><div class="modwrap"><i class="dot"></i>${cell('r'+i+'m',r.m)}</div></td><td>${cell('r'+i+'p',r.p)}</td>${r.d.map((v,j)=>'<td>'+cell('r'+i+'d'+j,v,'time')+'</td>').join('')}<td>${cell('r'+i+'r',r.r)}</td></tr>`).join('')}
    function fields(){return [...document.querySelectorAll('[data-k]')]} function setData(data){if(!data)return;fields().forEach(el=>{let k=el.dataset.k;if(Object.prototype.hasOwnProperty.call(data,k))el.textContent=data[k]||''})} function getData(){return Object.fromEntries(fields().map(el=>[el.dataset.k,el.textContent.trim()]))}
    function editable(on){page.classList.toggle('editable',on);page.classList.toggle('locked',!on);fields().forEach(el=>el.contentEditable=on?'plaintext-only':'false');bar.classList.toggle('active',on);document.querySelector('#adminTrigger').style.display=on?'none':'';status.textContent=on?'وضع التحرير مفعّل. اضغط «تأكيد ونشر التعديلات» عند الانتهاء.':'آخر نسخة منشورة من الجدول.'}
    async function load(){const {data,error}=await client.from('timetable_content').select('data,updated_at').eq('id',1).single();if(error){status.textContent='تعذر تحميل الجدول. حاول تحديث الصفحة.';return}setData(data.data);status.textContent='آخر تحديث: '+new Date(data.updated_at).toLocaleString('ar-MA')}
    build();load(); client.auth.getSession().then(({data})=>editable(!!data.session));
    document.querySelector('#adminTrigger').onclick=()=>dialog.showModal();document.querySelector('#closeDialog').onclick=()=>dialog.close();
    document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();let errorEl=document.querySelector('#loginError');errorEl.textContent='';let {error}=await client.auth.signInWithPassword({email:'admin@timetable.local',password:document.querySelector('#code').value});if(error){errorEl.textContent='رمز الدخول غير صحيح.';return}dialog.close();editable(true)};
    document.querySelector('#logout').onclick=async()=>{await client.auth.signOut();editable(false)};
    document.querySelector('#save').onclick=async()=>{let button=document.querySelector('#save');button.disabled=true;status.textContent='جار نشر التعديلات…';let {error}=await client.from('timetable_content').update({data:getData(),updated_at:new Date().toISOString()}).eq('id',1);button.disabled=false;if(error){status.textContent='تعذر حفظ التعديلات. أعد تسجيل الدخول ثم حاول مرة أخرى.';return}status.textContent='تم نشر التعديلات بنجاح، وستظهر للزوار عند تحميل الصفحة.'};
    document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-k]')){e.preventDefault();e.target.blur()}});
  })();
  </script>
</body>
</html>
